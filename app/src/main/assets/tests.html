<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesignCalc — formula tests</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { padding: 32px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
  td.msg { color: var(--muted); font-variant-numeric: tabular-nums; }
  .summary { font-size: 1.05rem; margin: 0 0 18px; }
  code { background: var(--bg-soft); padding: 2px 6px; border-radius: 6px; font-size: 0.88em; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="margin:0 0 6px">DesignCalc formula tests</h1>
  <p class="hint">Every calculation in the app is checked against hand-computed reference values.</p>
  <p class="summary" id="summary">Running…</p>
  <table>
    <thead><tr><th>Test</th><th>Result</th><th>Details</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="assets/calc.js"></script>
<script>
(function () {
  'use strict';
  const C = window.Calc;
  const rows = document.getElementById('rows');
  let pass = 0;
  let fail = 0;

  function near(actual, expected, tolerance) {
    return Math.abs(actual - expected) <= (tolerance === undefined ? 0.01 : tolerance);
  }

  function test(name, fn) {
    const tr = document.createElement('tr');
    try {
      const detail = fn();
      if (detail === false) throw new Error('returned false');
      pass++;
      tr.innerHTML = '<td>' + name + '</td><td><span class="badge ok">pass</span></td><td class="msg">' +
        (detail === undefined ? 'ok' : detail) + '</td>';
    } catch (error) {
      fail++;
      tr.innerHTML = '<td>' + name + '</td><td><span class="badge bad">fail</span></td><td class="msg">' +
        error.message + '</td>';
    }
    rows.appendChild(tr);
  }

  /* ------------------------------------------------------------ spindle speed */
  test('Spindle speed: 100 m/min on 50 mm = 636.62 rpm', function () {
    const v = C.spindleSpeed(100, 50);
    if (!near(v, 636.62, 0.01)) throw new Error('got ' + v);
    return v.toFixed(2) + ' rpm';
  });

  /* ------------------------------------------------------------------ turning */
  test('Turning: 200 m/min, 50 mm, 0.2 mm/rev, 2 mm depth', function () {
    const r = C.turning({ vc: 200, d: 50, f: 0.2, ap: 2, length: 100, kc: 2000 });
    if (!near(r.rpm, 1273.24, 0.01)) throw new Error('rpm ' + r.rpm);
    if (!near(r.feedRate, 254.65, 0.01)) throw new Error('feed ' + r.feedRate);
    if (!near(r.mrr, 80000, 0.5)) throw new Error('mrr ' + r.mrr);
    if (!near(r.time, 0.3927, 0.0005)) throw new Error('time ' + r.time);
    if (!near(r.force, 800, 0.01)) throw new Error('force ' + r.force);
    if (!near(r.power, 2666.67, 0.5)) throw new Error('power ' + r.power);
    return 'rpm 1273.24, MRR 80 000 mm³/min, 2.67 kW';
  });

  /* ----------------------------------------------------------------- drilling */
  test('Drilling: 25 m/min, 10 mm, 0.1 mm/rev, 30 mm deep', function () {
    const r = C.drilling({ vc: 25, d: 10, f: 0.1, length: 30 });
    if (!near(r.rpm, 795.77, 0.02)) throw new Error('rpm ' + r.rpm);
    if (!near(r.mrr, 6250.4, 1)) throw new Error('mrr ' + r.mrr);
    if (!near(r.travel, 33, 0.01)) throw new Error('travel ' + r.travel);
    if (!near(r.time, 0.4147, 0.001)) throw new Error('time ' + r.time);
    return 'rpm 795.77, MRR 6250 mm³/min, travel 33 mm';
  });

  /* ------------------------------------------------------------------ milling */
  test('Milling: 120 m/min, 20 mm, 4 teeth, fz 0.05', function () {
    const r = C.milling({ vc: 120, d: 20, fz: 0.05, z: 4, ap: 2, ae: 10, length: 100 });
    if (!near(r.rpm, 1909.86, 0.02)) throw new Error('rpm ' + r.rpm);
    if (!near(r.feedRate, 381.97, 0.05)) throw new Error('feed ' + r.feedRate);
    if (!near(r.mrr, 7639.4, 1)) throw new Error('mrr ' + r.mrr);
    if (!near(r.time, 0.2618, 0.001)) throw new Error('time ' + r.time);
    return 'rpm 1909.86, feed 381.97 mm/min';
  });

  /* ----------------------------------------------------------------- bearing */
  test('Bearing life: C 30 kN, P 5 kN, 1500 rpm, ball', function () {
    const r = C.bearingLife({ C: 30000, P: 5000, n: 1500, exponent: 3 });
    if (!near(r.l10rev, 216e6, 1)) throw new Error('rev ' + r.l10rev);
    if (!near(r.l10h, 2400, 0.01)) throw new Error('hours ' + r.l10h);
    return 'L10 = 216 million rev = 2400 h';
  });

  test('Bearing life: roller exponent 10/3 scales the same C/P ratio further', function () {
    const ball = C.bearingLife({ C: 30000, P: 5000, n: 1500, exponent: 3 });
    const roller = C.bearingLife({ C: 30000, P: 5000, n: 1500, exponent: 10 / 3 });
    if (!(roller.l10h > ball.l10h)) throw new Error('roller should be higher for the same C/P');
    return 'roller ' + roller.l10h.toFixed(0) + ' h > ball ' + ball.l10h.toFixed(0) + ' h';
  });

  test('Reliability factor a1 for 95% = 0.62', function () {
    if (C.reliabilityFactor(95) !== 0.62) throw new Error('got ' + C.reliabilityFactor(95));
    return 'a1 = 0.62';
  });

  /* --------------------------------------------------------------- key/shaft */
  test('Key: 100 N·m on 30 mm shaft, 8×7×28 key', function () {
    const r = C.keyCheck({ torque: 100, d: 30, w: 8, h: 7, L: 28, allowShear: 40, allowBearing: 80 });
    if (!near(r.force, 6666.67, 0.05)) throw new Error('force ' + r.force);
    if (!near(r.shearStress, 29.76, 0.02)) throw new Error('shear ' + r.shearStress);
    if (!near(r.bearingStress, 68.03, 0.05)) throw new Error('bearing ' + r.bearingStress);
    if (r.shearOk !== true || r.bearingOk !== true) throw new Error('limits not evaluated');
    return 'F 6666.7 N, τ 29.76 MPa, σ 68.03 MPa';
  });

  test('Shaft torsion: 100 N·m on 30 mm = 18.86 MPa', function () {
    const r = C.shaftTorsion(100, 30);
    if (!near(r.shearStress, 18.86, 0.01)) throw new Error('got ' + r.shearStress);
    return 'τ = 18.86 MPa';
  });

  test('Torque from power: 5 kW at 1440 rpm = 33.16 N·m', function () {
    const r = C.torqueFromPower(5, 1440);
    if (!near(r.torque, 33.16, 0.01)) throw new Error('got ' + r.torque);
    return 'T = 33.16 N·m';
  });

  /* ----------------------------------------------------------------- stackup */
  test('Stack-up: 40±0.1 + 15±0.05 + 5±0.02', function () {
    const r = C.stackup([
      { name: 'Housing', nominal: 40, tol: 0.1 },
      { name: 'Bearing', nominal: 15, tol: 0.05 },
      { name: 'Spacer', nominal: 5, tol: 0.02 },
    ]);
    if (!near(r.nominal, 60, 1e-9)) throw new Error('nominal ' + r.nominal);
    if (!near(r.worstTolerance, 0.17, 1e-9)) throw new Error('worst ' + r.worstTolerance);
    if (!near(r.rss, Math.sqrt(0.0129), 1e-9)) throw new Error('rss ' + r.rss);
    if (r.contributions[0].name !== 'Housing') throw new Error('contribution order wrong');
    return '60 ±0.17 worst case, ±' + r.rss.toFixed(4) + ' RSS';
  });

  test('Stack-up rejects an empty list', function () {
    let threw = false;
    try { C.stackup([]); } catch (e) { threw = true; }
    if (!threw) throw new Error('should throw');
    return 'throws as expected';
  });

  test('Turning rejects a negative input', function () {
    let threw = false;
    try {
      C.turning({ vc: -1, d: 50, f: 0.2, ap: 2, length: 100, kc: 2000 });
    } catch (e) { threw = true; }
    if (!threw) throw new Error('should throw');
    return 'validation works';
  });

  const summary = document.getElementById('summary');
  summary.innerHTML = fail === 0
    ? '<span class="badge ok">' + pass + ' passed</span> all formulas match the reference values.'
    : '<span class="badge bad">' + fail + ' failed</span> ' + pass + ' passed — check the rows below.';
})();
</script>
</body>
</html>
